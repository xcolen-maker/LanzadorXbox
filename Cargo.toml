[package]
name = "xbox-lanzador"
version = "0.3.0"
description = "Lanzador para Windows que instala, actualiza y ejecuta emuladores de Xbox Series en PC"
license = "MIT"
edition = "2024"

[dependencies]
chrono = "0.4.45"
eframe = "0.37.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_System_SystemInformation", "Win32_Foundation", "Win32_Globalization"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true

[build-dependencies]
winresource = "0.1.34"
